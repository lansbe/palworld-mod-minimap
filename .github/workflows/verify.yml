name: Verify
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: brew install lua
      - name: Check source
        run: python3 scripts/verify.py
      - name: Test
        run: lua tests/geometry.lua
